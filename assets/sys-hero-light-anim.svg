<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" fill="none" role="img"><style>
.f{animation:fi .32s ease-out both}
.r{animation:ri .42s cubic-bezier(.22,.68,.2,1) both}
.gx{transform-box:fill-box;transform-origin:0 50%;animation:gx .7s cubic-bezier(.3,.8,.25,1) both}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.glow{animation:glow 3s ease-in-out infinite alternate}
.flow{stroke-dasharray:6 4;animation:flow 1.2s linear infinite}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes ri{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:0.35;transform:scale(0.96)}50%{opacity:1;transform:scale(1.04)}}
@keyframes glow{0%{opacity:0.6}100%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="sys_gradient" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#1D4ED8"/>
  <stop offset="100%" stop-color="#0284C7"/>
</linearGradient>
<radialGradient id="vignette" cx="50%" cy="0%" r="90%">
  <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
  <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
</radialGradient>
</defs><rect width="1280" height="320" rx="16" fill="#FFFFFF"/><rect width="1280" height="320" rx="16" fill="url(#vignette)"/><rect x="0.5" y="0.5" width="1279" height="319" rx="16" fill="none" stroke="#E2E8F0" stroke-width="1"/><rect x="460.0" y="32" width="360" height="28" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/><circle cx="480.0" cy="46" r="3.5" fill="#059669" class="pulse"/><text x="494.0" y="50" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="700" fill="#0F172A" text-anchor="start" letter-spacing="1.1">KIAN B. // SYSTEMS &amp; COMPILERS ARCHITECTURE</text><text x="800.0" y="50" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="9" font-weight="800" fill="#059669" text-anchor="end">NOMINAL</text><text x="640.0" y="124" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="62" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="-2.2">Engineered at the limit.</text><text x="640.0" y="184" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="62" font-weight="800" fill="url(#sys_gradient)" text-anchor="middle" letter-spacing="-2.2">From silicon to model.</text><text x="640.0" y="222" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#64748B" text-anchor="middle" letter-spacing="-0.2">Compilers, microcontrollers &amp; applied AI where abstraction has a measurable cost.</text><line x1="48" y1="256" x2="1232" y2="256" stroke="#E2E8F0" stroke-width="1" opacity="1.0"/><text x="48" y="282" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start" letter-spacing="-0.5">26.1x</text><text x="48" y="300" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="start">Native JIT Speedup vs CPython</text><text x="344" y="282" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start" letter-spacing="-0.5">0 KB</text><text x="344" y="300" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="start">Garbage Collection Overhead</text><text x="640" y="282" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start" letter-spacing="-0.5">18 ms</text><text x="640" y="300" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="start">On-Device WASM Neural Vision</text><text x="936" y="282" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start" letter-spacing="-0.5">0 secrets</text><text x="936" y="300" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="start">Isolated Firmware Telemetry Push</text></svg>