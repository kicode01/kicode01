5">26.1x</text><text x="48" y="300" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#86868B" text-anchor="start">Faster JIT vs CPython</text><text x="344" y="282" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#F5F5F7" text-anchor="start" letter-spacing="-0.5">0 KB</text><text x="344" y="300" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#86868B" text-anchor="start">Garbage Collection Overhead</text><text x="640" y="282" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#F5F5F7" text-anchor="start" letter-spacing="-0.5">18 ms</text><text x="640" y="300" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#86868B" text-anchor="start">On-Device WASM Vision</text><text x="936" y="282" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#F5F5F7" text-anchor="start" letter-spacing="-0.5">0 secrets</text><text x="936" y="300" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#86868B" text-anchor="start">ESP32 Firmware Architecture</text></svg>