Regular,'SF Mono',Menlo,Consolas,monospace" font-size="7.5" font-weight="700" fill="#0369A1" text-anchor="middle" letter-spacing="1.0">VS CPYTHON</text><line x1="24" y1="308" x2="596" y2="308" stroke="#E2E8F0" stroke-width="1" opacity="1.0"/><text x="24" y="334" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="600" fill="#94A3B8" text-anchor="start" letter-spacing="0.8">0 KB GC OVERHEAD  ·  1.7KB WASM  ·  PE32+/ELF64 LINKERS</text><rect x="440" y="318" width="156" height="28" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/><text x="518" y="336" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="9" font-weight="700" fill="#2563EB" text-anchor="middle" letter-spacing="0.8">EXPLORE JIT ENGINE ↗</text></svg>