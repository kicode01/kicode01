</defs><rect width="1280" height="420" rx="18" fill="#000000"/><rect x="0.5" y="0.5" width="1279" height="419" rx="18" fill="none" stroke="#2C2C2E" stroke-width="1"/><line x1="0" y1="44" x2="1280" y2="44" stroke="#2C2C2E" stroke-width="1" opacity="1.0"/><text x="48" y="26" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#F5F5F7" text-anchor="start" letter-spacing="1.5">K1 UNIFIED SILICON ENGINE  /  HETEROGENEOUS COMPUTATION DIE</text><text x="1232" y="26" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#2997FF" text-anchor="end" letter-spacing="1.0">PRO ARCHITECTURE · ZERO GC · ZERO BORROW CHECKER OVERHEAD</text><rect x="48" y="62" width="1184" height="332" rx="14" fill="#0D0D0E" stroke="url(#die_border)" stroke-width="1.4"/><rect x="64" y="80" width="570" height="132" rx="10" fill="url(#core_glow)" stroke="#38383A" stroke-width="1"/><text x="84" y="108" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#F5F5F7" text-anchor="start">JIT COMPILER CORE</text><text x="608" y="108" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#2997FF" text-anchor="end">BLACK MAMBA v1.1.0</text><line x1="84" y1="118" x2="608" y2="118" stroke="#2C2C2E" stroke-width="1" opacity="1.0"/><text x="84" y="140" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#86868B" text-anchor="start">• Direct JIT: mmap(PROT_EXEC) direct x86-64 executable memory pages</text><text x="84" y="162" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#86868B" text-anchor="start">• Multiple Inheritance: Dynamic C3 Diamond MRO linearization in 0.42ms</text><text x="84" y="184" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#86868B" text-anchor="start">• Recursion: Tail-Call Elimination collapsing 5M frames to 0 stack bytes</text><rect x="646" y="80" width="570" height="132" rx="10" fill="url(#core_glow)" stroke="#38383A" stroke-width="1"/><text x="666" y="108" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#F5F5F7" text-anchor="start">NEURAL INFERENCE CASCADE</text><text x="1196" y="108" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#BF5AF2" text-anchor="end">TYPENSCRAPE</text><line x1="666" y1="118" x2="1196" y2="118" stroke="#2C2C2E" stroke-width="1" opacity="1.0"/><text x="666" y="140" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#86868B" text-anchor="start">• Multi-Tier Routing: Groq (Llama-3 @ 420ms) degrades gracefully to Gemini</text><text x="666" y="162" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#86868B" text-anchor="start">• Memory Bounding: 16-chunk IndexedDB paging prevents mobile browser OOM</text><text x="666" y="184" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#86868B" text-anchor="start">• Evaluation: Closed-loop beam search scoring over spaCy AST &amp; 50k grammar rules</text><line x1="64" y1="221" x2="1216" y2="221" stroke="#2C2C2E" stroke-width="1" opacity="1.0"/><rect x="450.0" y="211" width="380" height="20" rx="10" fill="#161617" stroke="#2C2C2E" stroke-width="1"/><text x="640.0" y="225" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="9" font-weight="800" fill="#2997FF" text-anchor="middle" letter-spacing="1.0">UNIFIED MEMORY FABRIC // 0 KB GC OVERHEAD</text><rect x="64" y="244" width="570" height="132" rx="10" fill="url(#core_glow)" stroke="#38383A" stroke-width="1"/><text x="84" y="272" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#F5F5F7" text-anchor="start">ON-DEVICE VISION ACCELERATOR</text><text x="608" y="272" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#FF375F" text-anchor="end">MEEMOMINI</text><line x1="84" y1="282" x2="608" y2="282" stroke="#2C2C2E" stroke-width="1" opacity="1.0"/><text x="84" y="304" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#86868B" text-anchor="start">• Client WASM: MediaPipe ImageSegmenter runs entirely on client silicon</text><text x="84" y="326" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#86868B" text-anchor="start">• Zero Server Hops: No frame ever leaves the machine · 18ms inference latency</text><text x="84" y="348" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#86868B" text-anchor="start">• Local Export: Hardware canvas WebGL shaders, local still/GIF/MP4 PWA encoding</text><rect x="646" y="244" width="570" height="132" rx="10" fill="url(#core_glow)" stroke="#38383A" stroke-width="1"/><text x="666" y="272" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#F5F5F7" text-anchor="start">EDGE FIRMWARE TRANSCEIVER</text><text x="1196" y="272" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#30D158" text-anchor="end">VOLTSENSE IoT</text><line x1="666" y1="282" x2="1196" y2="282" stroke="#2C2C2E" stroke-width="1" opacity="1.0"/><text x="666" y="304" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#86868B" text-anchor="start">• Memory-Bounded C++: ESP32 sampling room electrical load and occupancy</text><text x="666" y="326" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#86868B" text-anchor="start">• Zero Secrets: Hardware delegates push keys to serverless Vercel edge functions</text><text x="666" y="348" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#86868B" text-anchor="start">• Optocoupler Isolation: Device -&gt; Cloud Function -&gt; Firebase RTDB &amp; FCM alerts</text></svg>