</defs><rect width="1280" height="420" rx="16" fill="#050814"/><rect x="0.5" y="0.5" width="1279" height="419" rx="16" fill="none" stroke="#1E293B" stroke-width="1.2"/><line x1="0" y1="48" x2="1280" y2="48" stroke="#1E293B" stroke-width="1" opacity="1.0"/><circle cx="36" cy="24" r="4" fill="#818CF8" class="pulse"/><text x="50" y="28" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="800" fill="#818CF8" text-anchor="start" letter-spacing="1.5">SYSTEM CAPABILITIES  /  HETEROGENEOUS EXECUTION MATRIX</text><text x="1244" y="28" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#22D3EE" text-anchor="end" letter-spacing="1.2">4 FULLY INTEGRATED VERTICAL LAYERS</text><rect x="36" y="64" width="586" height="160" rx="12" fill="url(#card0_glow)" stroke="#334155" stroke-width="1.2"/><text x="56" y="94" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="800" fill="#818CF8" text-anchor="start" letter-spacing="1.0">01 / NATIVE COMPILER &amp; JIT RUNTIME</text><text x="602" y="94" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#F8FAFC" text-anchor="end">BLACK MAMBA v1.1.0</text><line x1="36" y1="106" x2="622" y2="106" stroke="#1E293B" stroke-width="1" opacity="1.0"/><text x="56" y="132" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">• Direct JIT: Allocates mmap(PROT_EXEC) memory in pure Python without runtime GC</text><text x="56" y="156" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">• Multiple Inheritance: Dynamic C3 Diamond MRO linearization resolves in 0.42ms</text><text x="56" y="180" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">• Stack Unwinding: DWARF exception frames + Tail-Call Collapse (5M -&gt; 0 frames)</text><text x="56" y="204" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#818CF8" text-anchor="start">Speedup: 26.1x faster vs CPython 3.14 · 1.7 KB WebAssembly modules · Native TLS 1.3/SQL</text><rect x="658" y="64" width="586" height="160" rx="12" fill="url(#card1_glow)" stroke="#334155" stroke-width="1.2"/><text x="678" y="94" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="800" fill="#22D3EE" text-anchor="start" letter-spacing="1.0">02 / ADAPTIVE APPLIED AI CASCADE</text><text x="1224" y="94" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#F8FAFC" text-anchor="end">TYPEN置CRAPE</text><line x1="658" y1="106" x2="1244" y2="106" stroke="#1E293B" stroke-width="1" opacity="1.0"/><text x="678" y="132" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">• Cascade Routing: Groq (Llama-3 @ 420ms) degrades gracefully to Gemini on 429 limits</text><text x="678" y="156" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">• Memory Bounding: 16-chunk IndexedDB paging ensures zero OOM on resource-tight devices</text><text x="678" y="180" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">• Offline-First: Local SQLite fallback dataset keeps user interaction 100% operational</text><text x="678" y="204" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#22D3EE" text-anchor="start">Resilience: Graceful degradation over outright failure · PWA mobile optimization</text><rect x="36" y="236" width="586" height="160" rx="12" fill="url(#card2_glow)" stroke="#334155" stroke-width="1.2"/><text x="56" y="266" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="800" fill="#C084FC" text-anchor="start" letter-spacing="1.0">03 / ON-DEVICE COMPUTER VISION</text><text x="602" y="266" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#F8FAFC" text-anchor="end">MEEMOMINI</text><line x1="36" y1="278" x2="622" y2="278" stroke="#1E293B" stroke-width="1" opacity="1.0"/><text x="56" y="304" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">• Client WASM: MediaPipe ImageSegmenter runs entirely in browser hardware</text><text x="56" y="328" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">• Absolute Privacy: Zero frames transmitted to servers · Background removal in 18ms</text><text x="56" y="352" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">• Real-Time Filters: Hardware canvas WebGL shaders, local still/GIF/MP4 encoding</text><text x="56" y="376" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#C084FC" text-anchor="start">Latency: 18ms on-device inference · Zero backend dependency · Installable PWA</text><rect x="658" y="236" width="586" height="160" rx="12" fill="url(#card3_glow)" stroke="#334155" stroke-width="1.2"/><text x="678" y="266" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="800" fill="#34D399" text-anchor="start" letter-spacing="1.0">04 / EDGE FIRMWARE &amp; TELEMETRY</text><text x="1224" y="266" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#F8FAFC" text-anchor="end">VOLTSENSE IoT</text><line x1="658" y1="278" x2="1244" y2="278" stroke="#1E293B" stroke-width="1" opacity="1.0"/><text x="678" y="304" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">• Firmware: Memory-bounded C++ on ESP32 sampling electrical load &amp; occupancy</text><text x="678" y="328" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">• Zero-Secret Hardware: Microcontroller delegates push credentials to edge functions</text><text x="678" y="352" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">• Pipeline: Device -&gt; Vercel Serverless -&gt; Firebase Cloud Messaging (FCM)</text><text x="678" y="376" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#34D399" text-anchor="start">Security: Optocoupler relay isolation · Physical hardware holds zero API keys</text><line x1="0" y1="406" x2="1280" y2="406" stroke="#1E293B" stroke-width="1" opacity="1.0"/><text x="36" y="416" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="8.5" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1.0">VERTICAL COHERENCE: SILICON FIRMWARE -&gt; RUNTIME JIT -&gt; MODEL ROUTING -&gt; CLIENT INTERFACE</text></svg>