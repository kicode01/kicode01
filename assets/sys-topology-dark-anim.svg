<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" fill="none" role="img"><style>
.f{animation:fi .32s ease-out both}
.r{animation:ri .42s cubic-bezier(.22,.68,.2,1) both}
.gx{transform-box:fill-box;transform-origin:0 50%;animation:gx .7s cubic-bezier(.3,.8,.25,1) both}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.glow{animation:glow 3s ease-in-out infinite alternate}
.flow{stroke-dasharray:6 4;animation:flow 1.2s linear infinite}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes ri{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:0.35;transform:scale(0.96)}50%{opacity:1;transform:scale(1.04)}}
@keyframes glow{0%{opacity:0.6}100%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="topo_border" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#2563EB" stop-opacity="0.8"/>
  <stop offset="50%" stop-color="#222230" stop-opacity="0.4"/>
  <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.8"/>
</linearGradient>
<linearGradient id="node_surface" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#14141C"/>
  <stop offset="100%" stop-color="#181824"/>
</linearGradient>
</defs><rect width="1280" height="420" rx="16" fill="#08080A"/><rect x="0.5" y="0.5" width="1279" height="419" rx="16" fill="none" stroke="#222230" stroke-width="1"/><line x1="0" y1="44" x2="1280" y2="44" stroke="#222230" stroke-width="1" opacity="1.0"/><text x="48" y="26" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#F8FAFC" text-anchor="start" letter-spacing="1.5">HETEROGENEOUS COMPUTATIONAL FABRIC  /  SUBSYSTEM TOPOLOGY</text><text x="1232" y="26" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#06B6D4" text-anchor="end" letter-spacing="1.0">ZERO GC · ZERO BORROW CHECKER OVERHEAD · TAIL-CALL OPTIMIZED</text><rect x="48" y="62" width="1184" height="332" rx="14" fill="#0F0F14" stroke="url(#topo_border)" stroke-width="1.2"/><rect x="64" y="80" width="570" height="132" rx="10" fill="url(#node_surface)" stroke="#2E2E42" stroke-width="1"/><text x="84" y="108" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#F8FAFC" text-anchor="start">NATIVE JIT COMPILER ENGINE</text><text x="608" y="108" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#06B6D4" text-anchor="end">BLACK MAMBA v1.1.0</text><line x1="84" y1="118" x2="608" y2="118" stroke="#222230" stroke-width="1" opacity="1.0"/><text x="84" y="140" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">• Direct JIT: mmap(PROT_EXEC) direct x86-64 executable memory pages</text><text x="84" y="162" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">• Multiple Inheritance: Dynamic C3 Diamond MRO linearization in 0.42ms</text><text x="84" y="184" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">• Recursion: Tail-Call Elimination collapsing 5M frames to 0 stack bytes</text><rect x="646" y="80" width="570" height="132" rx="10" fill="url(#node_surface)" stroke="#2E2E42" stroke-width="1"/><text x="666" y="108" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#F8FAFC" text-anchor="start">STOCHASTIC RESILIENCE CASCADE</text><text x="1196" y="108" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#8B5CF6" text-anchor="end">TYPENSCRAPE</text><line x1="666" y1="118" x2="1196" y2="118" stroke="#222230" stroke-width="1" opacity="1.0"/><text x="666" y="140" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">• Multi-Tier Routing: Groq (Llama-3 @ 420ms) degrades gracefully to Gemini</text><text x="666" y="162" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">• Memory Bounding: 16-chunk IndexedDB paging prevents mobile browser OOM</text><text x="666" y="184" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">• Evaluation: Closed-loop beam search scoring over spaCy AST &amp; 50k grammar rules</text><line x1="64" y1="221" x2="1216" y2="221" stroke="#222230" stroke-width="1" opacity="1.0"/><line x1="64" y1="221" x2="1216" y2="221" stroke="#06B6D4" stroke-width="1.8" class="flow"/><rect x="435.0" y="211" width="410" height="20" rx="10" fill="#14141C" stroke="#222230" stroke-width="1"/><text x="640.0" y="225" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="9" font-weight="800" fill="#06B6D4" text-anchor="middle" letter-spacing="1.0">UNIFIED HIGH-THROUGHPUT FABRIC // ZERO-ALLOC PIPELINE</text><rect x="64" y="244" width="570" height="132" rx="10" fill="url(#node_surface)" stroke="#2E2E42" stroke-width="1"/><text x="84" y="272" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#F8FAFC" text-anchor="start">ON-DEVICE VISION ACCELERATOR</text><text x="608" y="272" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#EC4899" text-anchor="end">MEEMOMINI</text><line x1="84" y1="282" x2="608" y2="282" stroke="#222230" stroke-width="1" opacity="1.0"/><text x="84" y="304" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">• Client WASM: MediaPipe ImageSegmenter runs entirely on client silicon</text><text x="84" y="326" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">• Zero Server Hops: No frame ever leaves the machine · 18ms inference latency</text><text x="84" y="348" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">• Local Export: Hardware canvas WebGL shaders, local still/GIF/MP4 PWA encoding</text><rect x="646" y="244" width="570" height="132" rx="10" fill="url(#node_surface)" stroke="#2E2E42" stroke-width="1"/><text x="666" y="272" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#F8FAFC" text-anchor="start">EDGE FIRMWARE TRANSCEIVER</text><text x="1196" y="272" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#10B981" text-anchor="end">VOLTSENSE IoT</text><line x1="666" y1="282" x2="1196" y2="282" stroke="#222230" stroke-width="1" opacity="1.0"/><text x="666" y="304" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">• Memory-Bounded C++: ESP32 sampling room electrical load and occupancy</text><text x="666" y="326" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">• Zero Secrets: Hardware delegates push keys to serverless Vercel edge functions</text><text x="666" y="348" font-family="-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">• Optocoupler Isolation: Device -&gt; Cloud Function -&gt; Firebase RTDB &amp; FCM alerts</text></svg>