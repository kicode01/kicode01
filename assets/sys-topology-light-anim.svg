)"/><text x="684.0" y="74" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#C85A6E" text-anchor="start">05 Codegen</text><text x="684.0" y="96" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#232020" text-anchor="start">x86-64 &amp; WASM</text><text x="684.0" y="116" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="500" fill="#857E76" text-anchor="start">0 KB GC overhead</text><text x="26" y="154" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#524D48" text-anchor="start">Standard library includes pure-native TLS 1.3, relational SQL, and a 24-bit RGB GUI.</text></svg>