name: Telemetry IssueOps Ping

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: telemetry-ping
  cancel-in-progress: false

jobs:
  process-ping:
    if: contains(github.event.issue.labels.*.name, 'telemetry-ping') || startsWith(github.event.issue.title, '[TELEMETRY PING]') || startsWith(github.event.issue.title, '[PING]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Process Inbound Telemetry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python ping.py --issue ${{ github.event.issue.number }} --sender ${{ github.event.issue.user.login }}

      - name: Commit and push telemetry state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telemetry.json assets/ README.md
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(telemetry): ack signal #${{ github.event.issue.number }} from @${{ github.event.issue.user.login }} [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
