name: Refresh profile assets

# Keeps the banner, heatmap, and language bar current. The alternative — a
# third-party stat-card service — goes down, gets rate-limited, or silently
# serves a cached image; regenerating from the API costs nothing and never rots.

on:
  schedule:
    - cron: "17 4 * * 1"      # Mondays, 04:17 UTC
  workflow_dispatch:           # manual run from the Actions tab
  push:
    branches: [main]
    paths:
      - "generate.py"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The default GITHUB_TOKEN is an installation token scoped to this one
      # repository. It can read repos fine, but its view of the contribution
      # calendar silently omits commits to every other repo — which is most of
      # the graph. Refusing to run beats publishing a quietly wrong number.
      - name: Require a user-scoped token
        env:
          TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PROFILE_TOKEN is not set. The default GITHUB_TOKEN only sees this repository, so contribution counts would omit work in every other repo. Add a classic PAT with the 'read:user' scope as the PROFILE_TOKEN secret."
            exit 1
          fi

      - name: Regenerate SVG assets
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python generate.py --fetch

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Assets already current — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # README.md is included because generate.py rewrites the one sentence
          # that quotes live numbers.
          git add assets stats.json README.md
          git commit -m "chore: refresh profile assets"
          # A push can land between checkout and here; rebase rather than fail.
          git pull --rebase --autostash origin main
          git push
