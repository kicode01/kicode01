name: Refresh profile assets

# Keeps the banner, heatmap, language bar, and architecture pipeline current.
# The alternative — a third-party stat-card service — goes down, gets rate-limited,
# or silently serves a cached image; regenerating from the API costs nothing and never rots.

on:
  schedule:
    - cron: "17 4 * * 1"      # Mondays, 04:17 UTC
  workflow_dispatch:           # manual run from the Actions tab
  push:
    branches: [main]
    paths:
      - "generate.py"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve GitHub Token
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          if [ -n "$PROFILE_TOKEN" ]; then
            echo "GH_TOKEN=$PROFILE_TOKEN" >> $GITHUB_ENV
          else
            echo "::warning::PROFILE_TOKEN secret not found. Falling back to default GITHUB_TOKEN."
            echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV
          fi

      - name: Regenerate SVG assets
        run: python generate.py --fetch

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Assets already current — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets stats.json telemetry.json README.md
          git commit -m "chore: refresh profile assets"
          git pull --rebase --autostash origin main
          git push
